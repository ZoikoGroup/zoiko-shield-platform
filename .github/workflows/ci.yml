name: ZoikoShield CI — ERB-01

on:
  push:
    branches: [main, develop, Aditya]
  pull_request:
    branches: [main, develop, Aditya]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Backend Lint & Per-App Type Check
  # ────────────────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check (6 Apps)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript type check (shield-core)
        run: npx tsc --noEmit -p apps/shield-core/tsconfig.app.json

      - name: TypeScript type check (shield-ingest)
        run: npx tsc --noEmit -p apps/shield-ingest/tsconfig.app.json

      - name: TypeScript type check (shield-action)
        run: npx tsc --noEmit -p apps/shield-action/tsconfig.app.json

      - name: TypeScript type check (shield-anchor)
        run: npx tsc --noEmit -p apps/shield-anchor/tsconfig.app.json

      - name: TypeScript type check (shield-ai)
        run: npx tsc --noEmit -p apps/shield-ai/tsconfig.app.json

      - name: TypeScript type check (verifier-cli)
        run: npx tsc --noEmit -p apps/verifier-cli/tsconfig.app.json

      - name: ESLint
        run: npm run lint

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Frontend CI (Next.js 15, TypeScript & Vitest Suite)
  # ────────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Lint, Type Check & Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Run Vitest Suite (76 Tests)
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Unit Tests (all backend apps)
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      # coverageThreshold in backend/package.json fails this step on regression.
      - name: Run unit tests with coverage
        run: npx jest --coverage --coverageReporters=text-summary --coverageReporters=json-summary --coverageReporters=lcov --forceExit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: backend/coverage/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Security Tests (cross-tenant isolation + prompt injection)
  # ────────────────────────────────────────────────────────────────────────────
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-ci]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run cross-tenant isolation tests
        run: npx jest apps/shield-core/src/security --no-coverage --forceExit

      - name: Run prompt-injection tests
        run: npx jest apps/shield-ai/src/security --no-coverage --forceExit

      - name: Run anti-tampering E2E test
        run: npm run test:e2e --passWithNoTests

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Dependency Vulnerability Scan (fails on HIGH / CRITICAL)
  # ────────────────────────────────────────────────────────────────────────────
  # npm audit rather than a third-party scanner action: it needs no extra
  # action with repo-token access, and covers the npm dependency graph that
  # makes up every shipped service.
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Build Docker Images (validates the build succeeds)
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [unit-tests, security-tests, frontend-ci]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shield-core image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: zoikoshield/shield-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build shield-ingest image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: zoikoshield/shield-ingest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build shield-ai image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: zoikoshield/shield-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build shield-action image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: zoikoshield/shield-action:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build shield-anchor image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: zoikoshield/shield-anchor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 7. Release Gate — checks all blockers before merge to main
  # ────────────────────────────────────────────────────────────────────────────
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [build, dependency-audit]
    # A merge gate must run on the proposed merge commit, not only after code
    # has already reached main. Keep the same checks on direct main pushes.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run offline verifier smoke test
        run: npx jest apps/verifier-cli/test/verifier-airgap-standalone.spec.ts --no-coverage --runInBand

      - name: Confirm no release blockers in code
        run: |
          echo "Checking for cross-tenant bypass patterns..."
          # Ensure no controller bypasses the tenant_id filter
          ! grep -r "findMany({" apps/ --include="*.ts" | grep -v "tenant_id" | grep -v "spec" | grep -v "node_modules"
          echo "Release gate passed"
