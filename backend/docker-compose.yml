version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: shield_postgres
    environment:
      POSTGRES_USER: shield_user
      POSTGRES_PASSWORD: shield_pass
      POSTGRES_DB: shield_db
    ports:
      - "5433:5432" # Use 5433 on host to avoid conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  jooq-generator:
    image: maven:3.9.6-eclipse-temurin-21
    container_name: shield_jooq_generator
    working_dir: /app
    volumes:
      - ./packages/shield-core:/app
    command: ["mvn", "flyway:migrate", "generate-sources"]
    depends_on:
      - postgres

volumes:
  postgres_data:
