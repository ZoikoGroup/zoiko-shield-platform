openapi: 3.0.3
info:
  title: ZoikoShield - Shield Core API
  version: 1.0.0
  description: >
    Auth is cookie-based (httpOnly access_token / refresh_token, Secure, SameSite=Lax).
    Postman's built-in cookie jar handles this automatically once you've called Login or
    Verify Email on {{baseUrl}}. If a protected request returns 401, check Postman's
    Cookies drawer — the Secure flag means cookies only attach when baseUrl is exactly
    http://localhost:... (not 127.0.0.1).
servers:
  - url: http://localhost:3001
    description: Local development
tags:
  - name: Auth
    description: Identity adapter – registration, login, OAuth, sessions
  - name: RBAC
    description: Authorization – permissions, roles, invitations (platform-gated)
  - name: Tenant
    description: Tenant CRUD (in-memory)
  - name: Customer
    description: Customer CRUD (in-memory)
  - name: Organization
    description: Organization CRUD (in-memory)
  - name: LegalEntity
    description: Legal Entity CRUD (in-memory)
  - name: Environment
    description: Environment CRUD (in-memory)

components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        Primary auth mechanism — httpOnly, Secure, SameSite=Lax. Set automatically
        by login/verify-email/refresh; never exposed in a response body.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Fallback extractor for API tooling (e.g. Postman with manual header).
        The web app uses CookieAuth exclusively.

  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password, confirmPassword, termsOfServiceVersion]
      properties:
        fullName: { type: string, example: "Test User" }
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        confirmPassword: { type: string, minLength: 12 }
        termsOfServiceVersion: { type: string, example: "1", description: Must match the currently active TERMS_OF_SERVICE PolicyDocument version. }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    VerifyEmailRequest:
      type: object
      required: [email, otp]
      properties:
        email: { type: string, format: email }
        otp: { type: string, minLength: 6, maxLength: 6 }
    EmailOnlyRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordRecoveryResetRequest:
      type: object
      required: [newPassword, confirmNewPassword]
      description: Authorized by the recovery_grant cookie from /auth/password-recovery/verify.
      properties:
        newPassword: { type: string, minLength: 12 }
        confirmNewPassword: { type: string, minLength: 12 }
    UserResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        emailVerified: { type: boolean }
        assurance: { type: string, enum: [PASSWORD, PASSWORD_MFA, FEDERATED, FEDERATED_MFA, PASSKEY, RECOVERY] }
    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/UserResponse" }
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
    MessageResponse:
      type: object
      properties:
        message: { type: string }
    CreatePermissionRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, example: "case:create" }
        description: { type: string, example: "Create a case" }
    Permission:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        description: { type: string, nullable: true }
    CreateRoleRequest:
      type: object
      required: [code, name, roleLevel]
      properties:
        tenantId: { type: string, format: uuid }
        code: { type: string, example: SECURITY_ANALYST }
        name: { type: string, example: Security Analyst }
        roleLevel: { type: string, enum: [PLATFORM, TENANT] }
        permissionCodes: { type: array, items: { type: string } }
    UpdateRolePermissionsRequest:
      type: object
      required: [permissionCodes]
      properties:
        permissionCodes: { type: array, items: { type: string } }
    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid, nullable: true }
        code: { type: string }
        name: { type: string }
        roleLevel: { type: string, enum: [PLATFORM, TENANT] }
        permissions: { type: array, items: { $ref: "#/components/schemas/Permission" } }
        createdAt: { type: string, format: date-time }
    CreateInvitationRequest:
      type: object
      required: [invitedEmail, roleId]
      properties:
        invitedEmail: { type: string, format: email }
        roleId: { type: string, format: uuid }
    InvitationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        invitedEmail: { type: string }
        roleId: { type: string, format: uuid }
        token: { type: string, description: One-time invitation token }
        createdAt: { type: string, format: date-time }
    TenantMembership:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REMOVED] }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        joinedAt: { type: string, format: date-time }
    # ── Canonical Context ──
    CanonicalContext:
      type: object
      description: >
        Immutable audit envelope attached to every domain record. Most fields are
        server-generated on create; the client cannot forge tenantId, correlationId,
        traceId, requestId, policyVersion or recordedAt.
      required: [tenantId, legalEntityId, environmentId, region, correlationId, traceId, requestId, purpose, dataClass, policyVersion, contractId, contractVersion, recordedAt]
      properties:
        tenantId: { type: string, format: uuid, description: Owning tenant — server-assigned on creation }
        legalEntityId: { type: string, format: uuid, description: Legal entity under which this record falls }
        environmentId: { type: string, format: uuid, description: Deployment environment (prod, staging, etc.) }
        region: { type: string, example: us-east-1, description: Cloud region or data residency zone }
        actorId: { type: string, description: User or service account that caused the mutation (optional) }
        workloadId: { type: string, description: Originating workload/microservice identifier (optional) }
        correlationId: { type: string, format: uuid, description: Links related events across services — server-generated }
        causationId: { type: string, description: ID of the event that directly caused this one (optional) }
        traceId: { type: string, format: uuid, description: Distributed tracing span root — server-generated }
        requestId: { type: string, format: uuid, description: Per-request unique ID — server-generated }
        idempotencyKey: { type: string, description: Client-supplied idempotency key for safe retries (optional) }
        purpose: { type: string, example: security-monitoring, description: GDPR/privacy purpose tag }
        dataClass: { type: string, example: internal, description: Data classification level }
        policyVersion: { type: string, description: Version of the governing policy — server-generated }
        contractId: { type: string, description: Commercial contract reference }
        contractVersion: { type: string, description: Version of the contract }
        occurredAt: { type: string, format: date-time, description: When the real-world event occurred (optional) }
        observedAt: { type: string, format: date-time, description: When the system observed the event (optional) }
        recordedAt: { type: string, format: date-time, description: When the record was persisted — server-generated }

    # ── Tenant ──
    CreateTenantRequest:
      type: object
      required: [name]
      description: >
        Context fields (tenantId, correlationId, traceId, requestId, policyVersion,
        recordedAt) are all server-generated now — the client can no longer forge them.
      properties:
        name: { type: string, example: Acme Corp }
    UpdateTenantRequest:
      type: object
      properties:
        name: { type: string, example: Acme Corp Renamed }
        status: { type: string, enum: [active, suspended, offboarded] }
    Tenant:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended, offboarded] }
        context: { $ref: "#/components/schemas/CanonicalContext" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCustomerRequest:
      type: object
      required: [party_id, customer_type]
      properties:
        party_id: { type: string }
        customer_type: { type: string, example: enterprise }
        segment: { type: string, example: mid-market }
    UpdateCustomerRequest:
      type: object
      properties:
        party_id: { type: string }
        customer_type: { type: string }
        lifecycle_status: { type: string }
        kyc_status: { type: string }
        segment: { type: string }
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        party_id: { type: string }
        customer_type: { type: string }
        lifecycle_status: { type: string }
        kyc_status: { type: string }
        segment: { type: string }
        context: { $ref: "#/components/schemas/CanonicalContext" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerListResponse:
      type: object
      properties:
        customers: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        total: { type: integer }
    CreateNameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    UpdateNameRequest:
      type: object
      properties:
        name: { type: string }
        status: { type: string }
    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        context: { $ref: "#/components/schemas/CanonicalContext" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LegalEntity:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        context: { $ref: "#/components/schemas/CanonicalContext" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Environment:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string }
        context: { $ref: "#/components/schemas/CanonicalContext" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DataListResponse:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        total: { type: integer }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: >
        No tokens returned. termsOfServiceVersion must match the currently active
        TERMS_OF_SERVICE policy document (seeded as "1" on first boot). A 6-digit OTP
        is emailed. 403 if LOCAL_REGISTRATION_ENABLED=false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Registration successful, content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } } }
        "400": { description: Validation error }
        "403": { description: Local registration disabled }
        "409": { description: Email already registered }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify email with OTP
      description: Consumes the registration OTP, marks user verified, logs them in — access_token/refresh_token are set as httpOnly cookies, not returned in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { description: Email verified and logged in (cookies set), content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "400": { description: Invalid or expired OTP }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Resend verification OTP
      description: Always returns a generic message — avoids user enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnlyRequest" }
      responses:
        "200": { description: Generic success, content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } } }

  /auth/password-recovery/request:
    post:
      tags: [Auth]
      summary: Password Recovery – Request OTP
      description: Always returns a generic message. Sends a PASSWORD_RECOVERY OTP only if the account exists AND has a local password (never for federated-only accounts).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailOnlyRequest" }
      responses:
        "200": { description: Generic success, content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } } }

  /auth/password-recovery/verify:
    post:
      tags: [Auth]
      summary: Password Recovery – Verify OTP
      description: Consumes the OTP and sets a short-lived, single-use recovery_grant cookie (scoped to /auth/password-recovery only — does NOT log you in or grant normal access).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { description: OTP verified – recovery_grant cookie set, content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } } }
        "400": { description: Invalid or expired OTP }

  /auth/password-recovery/reset:
    post:
      tags: [Auth]
      summary: Password Recovery – Reset password
      description: Reads the recovery_grant cookie from the Verify step (no email/otp needed). Updates password and revokes ALL existing sessions — must log in fresh afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRecoveryResetRequest" }
      responses:
        "200": { description: Password reset successful, content: { application/json: { schema: { $ref: "#/components/schemas/MessageResponse" } } } }
        "401": { description: Missing or invalid recovery_grant cookie }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      description: 401 if the account isn't verified yet. On success, sets access_token/refresh_token httpOnly cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Login successful (cookies set), content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }
        "401": { description: Invalid credentials or unverified account }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh token (rotates)
      description: Reads refresh_token from the cookie jar (no body needed), revokes it, and sets a new cookie pair.
      responses:
        "200": { description: Tokens rotated (cookies set), content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } } }
        "401": { description: No or invalid refresh token }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      description: Reads refresh_token from the cookie jar, revokes that session, and clears both cookies.
      responses:
        "200": { description: Logged out, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } } }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Logout all sessions
      security: [{ CookieAuth: [] }]
      responses:
        "200": { description: All sessions revoked, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } } }
        "401": { description: Unauthorized }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security: [{ CookieAuth: [] }]
      responses:
        "200": { description: Current user, content: { application/json: { schema: { $ref: "#/components/schemas/UserResponse" } } } }
        "401": { description: Unauthorized }

  /auth/google:
    get:
      tags: [Auth]
      summary: Google OAuth login (browser redirect)
      responses:
        "302": { description: Redirect to Google }

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      responses:
        "200": { description: OAuth login successful (cookies set), content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }

  /auth/microsoft:
    get:
      tags: [Auth]
      summary: Microsoft OAuth login (browser redirect)
      responses:
        "302": { description: Redirect to Microsoft }

  /auth/microsoft/callback:
    get:
      tags: [Auth]
      summary: Microsoft OAuth callback
      responses:
        "200": { description: OAuth login successful (cookies set), content: { application/json: { schema: { $ref: "#/components/schemas/AuthResponse" } } } }

  /auth/invitations/{invitationToken}/accept:
    post:
      tags: [Auth]
      summary: Accept invitation
      description: Must be called while authenticated (cookie) as the exact email the invitation was sent to — enforced server-side.
      security: [{ CookieAuth: [] }]
      parameters:
        - name: invitationToken
          in: path
          required: true
          schema: { type: string }
          description: One-time invitation token from the Create Invitation response
      responses:
        "200": { description: Invitation accepted, content: { application/json: { schema: { $ref: "#/components/schemas/TenantMembership" } } } }
        "401": { description: Unauthorized }
        "403": { description: Authenticated email does not match invited email }
        "404": { description: Invalid or expired token }

  /permissions:
    post:
      tags: [RBAC]
      summary: Create permission (platform-gated)
      description: Requires platform:permission:manage. Run `npm run seed:platform-admin -- <email>` first. Otherwise 403.
      security: [{ CookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePermissionRequest" }
      responses:
        "201": { description: Permission created, content: { application/json: { schema: { $ref: "#/components/schemas/Permission" } } } }
        "401": { description: Unauthorized }
        "403": { description: Missing platform:permission:manage }

  /roles:
    get:
      tags: [RBAC]
      summary: List roles
      security: [{ CookieAuth: [] }]
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200": { description: List of roles, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Role" } } } } }
        "401": { description: Unauthorized }
    post:
      tags: [RBAC]
      summary: Create role (platform-gated)
      description: Requires platform:role:manage.
      security: [{ CookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201": { description: Role created, content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "401": { description: Unauthorized }
        "403": { description: Missing platform:role:manage }

  /roles/{roleId}/permissions:
    patch:
      tags: [RBAC]
      summary: Update role permissions (platform-gated)
      security: [{ CookieAuth: [] }]
      parameters:
        - name: roleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRolePermissionsRequest" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Role" } } } }
        "401": { description: Unauthorized }
        "404": { description: Role not found }

  /tenants/{tenantId}/invitations:
    post:
      tags: [RBAC]
      summary: Create invitation (tenant-gated)
      description: Requires tenant:member:invite within the tenant. The inviter picks the tenant and role. Response includes a one-time token.
      security: [{ CookieAuth: [] }]
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitationRequest" }
      responses:
        "201": { description: Invitation created, content: { application/json: { schema: { $ref: "#/components/schemas/InvitationResponse" } } } }
        "401": { description: Unauthorized }
        "403": { description: Missing tenant:member:invite }

  /tenant:
    post:
      tags: [Tenant]
      summary: Create tenant
      description: Context fields (tenantId, correlationId, traceId, requestId, policyVersion, recordedAt) are all server-generated — the client can no longer forge them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTenantRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
    get:
      tags: [Tenant]
      summary: List tenants
      responses:
        "200": { description: All tenants, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Tenant" } } } } }

  /tenant/{id}:
    get:
      tags: [Tenant]
      summary: Get tenant by ID
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Found, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "404": { description: Not found }
    patch:
      tags: [Tenant]
      summary: Update tenant
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTenantRequest" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Tenant" } } } }
        "404": { description: Not found }
    delete:
      tags: [Tenant]
      summary: Delete tenant
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Deleted }
        "404": { description: Not found }

  /v1/customers:
    post:
      tags: [Customer]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
    get:
      tags: [Customer]
      summary: List customers
      responses:
        "200": { description: Customer list, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerListResponse" } } } }

  /v1/customers/{id}:
    get:
      tags: [Customer]
      summary: Get customer by ID
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Found, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "404": { description: Not found }
    patch:
      tags: [Customer]
      summary: Update customer
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } }
        "404": { description: Not found }
    delete:
      tags: [Customer]
      summary: Delete customer
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Deleted }
        "404": { description: Not found }

  /v1/organizations:
    post:
      tags: [Organization]
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNameRequest" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
    get:
      tags: [Organization]
      summary: List organizations
      responses:
        "200": { description: Organization list, content: { application/json: { schema: { $ref: "#/components/schemas/DataListResponse" } } } }

  /v1/organizations/{id}:
    get:
      tags: [Organization]
      summary: Get organization by ID
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Found, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        "404": { description: Not found }
    patch:
      tags: [Organization]
