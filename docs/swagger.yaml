      responses:
        "200": { description: Deliveries list }

  /api/v1/notifications/{notificationId}:
    get:
      tags: [Notifications]
      summary: Get a notification delivery
      parameters:
        - { $ref: "#/components/parameters/TenantIdHeader" }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: NotificationDelivery }

  /api/v1/notifications/{notificationId}/acknowledge:
    post:
      tags: [Notifications]
      summary: Acknowledge a notification (SEEN/ACKNOWLEDGED/ACCEPTED/DECLINED — delivery is never treated as acknowledgement, and SEEN is never treated as APPROVED)
      parameters:
        - { $ref: "#/components/parameters/TenantIdHeader" }
        - { $ref: "#/components/parameters/ActorIdHeader" }
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Acknowledgement recorded }
        "403": { description: Only the recipient may acknowledge }

  /api/v1/notification-preferences:
    get:
      tags: [Notifications]
      summary: List the current actor's notification preferences
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/ActorIdHeader" }]
      responses:
        "200": { description: Preferences list }

  /api/v1/notification-preferences/{id}:
    patch:
      tags: [Notifications]
      summary: Set a channel preference (mandatory policies can never be suppressed by preference)
      parameters:
        - { $ref: "#/components/parameters/TenantIdHeader" }
        - { $ref: "#/components/parameters/ActorIdHeader" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Preference set }

  /api/v1/notification-policies:
    get:
      tags: [Notifications]
      summary: List active notification policies (admin-controlled)
      responses:
        "200": { description: Policies list }

  /api/v1/notification-deliveries/{id}:
    get:
      tags: [Notifications]
      summary: Get a delivery with acknowledgement history (admin-controlled)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Delivery with acknowledgements }

  # ── Offboarding ──
  /api/v1/tenants/{tenantId}/offboarding:
    post:
      tags: [Offboarding]
      summary: Start tenant offboarding (privileged; idempotent — a repeated command returns the in-flight run)
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ActorIdHeader" }]
      responses:
        "201": { description: TenantOffboardingRun created (status EXPORT_REQUIRED) }
        "403": { description: Actor is not authorized to start offboarding }
    get:
      tags: [Offboarding]
      summary: Get the latest offboarding run for a tenant
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: TenantOffboardingRun }

  /api/v1/tenants/{tenantId}/offboarding/validate:
    post:
      tags: [Offboarding]
      summary: Check active legal holds before proceeding
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: "{ legalHolds[], ready }" }

  /api/v1/tenants/{tenantId}/offboarding/start-export:
    post:
      tags: [Offboarding]
      summary: Generate and verify the final tenant export (deletion is never allowed before this completes — spec correction, no shortcuts)
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Run advances to EXPORT_READY }
        "409": { description: Final export did not complete }

  /api/v1/tenants/{tenantId}/offboarding/freeze-access:
    post:
      tags: [Offboarding]
      summary: Freeze tenant access and revoke all active API clients
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Run advances to ACCESS_FROZEN; API clients suspended then revoked }

  /api/v1/tenants/{tenantId}/offboarding/start-deletion:
    post:
      tags: [Offboarding]
      summary: Revoke connectors and run the deletion workflow (blocked by any intersecting active legal hold — explicit BLOCKED_BY_HOLD state, never silently retained or silently deleted)
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }, { $ref: "#/components/parameters/ActorIdHeader" }]
      responses:
        "200": { description: Run advances to BACKUP_EXPIRY_PENDING, or BLOCKED if a legal hold intersects the deletion scope }

  /api/v1/tenants/{tenantId}/offboarding/deletion-attestation:
    get:
      tags: [Offboarding]
      summary: Get the deletion attestation (discloses retained scopes, legal holds, and pending backup expiry — never claims immediate/complete deletion unless verified)
      parameters: [{ name: tenantId, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: DeletionAttestation }

