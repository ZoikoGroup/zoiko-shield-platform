      responses:
        "200": { description: Open evidence gaps }
    post:
      tags: [Controls]
      summary: Run an assessment for a control implementation + test version over a period (incomplete evidence stops at EVIDENCE_INCOMPLETE — never proceeds to evaluation on partial evidence)
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }, { $ref: "#/components/parameters/ActorIdHeader" }]
      responses:
        "201": { description: Assessment produced (status/effectiveness/completeness/freshness/integrity kept as separate fields) }

  /api/v1/assessments/{id}:
    get:
      tags: [Controls]
      summary: Get assessment
      parameters:
        - { $ref: "#/components/parameters/TenantIdHeader" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Assessment }

  /api/v1/assessments/{id}/review:
    post:
      tags: [Controls]
      summary: Record human review of an assessment (reviewer must differ from performer — an automated result never self-approves)
      parameters:
        - { $ref: "#/components/parameters/TenantIdHeader" }
        - { $ref: "#/components/parameters/ActorIdHeader" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Assessment reviewed }
        "400": { description: Reviewer is the same identity as the performer }

  /api/v1/assessments/{id}/gaps:
    get:
      tags: [Controls]
      summary: List open evidence gaps for the tenant
      parameters: [{ $ref: "#/components/parameters/TenantIdHeader" }]
      responses:
        "200": { description: Evidence gaps (never filtered out of any report) }

