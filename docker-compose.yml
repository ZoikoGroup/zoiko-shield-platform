name: zoikoshield

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shield}
      POSTGRES_DB: ${POSTGRES_DB:-shield_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shield} -d ${POSTGRES_DB:-shield_core}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka-API-compatible event backbone stand-in for shield-ingest/shield-core eventing.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:8082
    ports:
      - "${REDPANDA_KAFKA_PORT:-9093}:9092"
      - "${REDPANDA_PROXY_PORT:-8082}:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3-compatible object store standing in for raw/normalized/evidence storage.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-shield}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-shield12345}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Hot analytics/search projection. Not needed until detection/case work lands.
  opensearch:
    image: opensearchproject/opensearch:2.17.0
    restart: unless-stopped
    profiles: ["search"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  shield-core-migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    # Migrations and the access policy run as the schema owner. Services run
    # as their own non-superuser logins: the superuser bypasses row-level
    # security, so a service connected as it would never be tenant-isolated.
    command: ["sh", "-c", "node scripts/create-local-service-logins.js && npm run migrate:deploy"]
    environment:
      MIGRATION_DATABASE_URL: ${DOCKER_MIGRATION_DATABASE_URL:-postgres://${POSTGRES_USER:-shield}:${POSTGRES_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_core}}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-shield}
      DATABASE_ROLE_MEMBERS: '{"shield_core_app":["shield_core_svc"],"shield_ingest_app":["shield_ingest_svc"],"shield_ai_app":["shield_ai_svc"],"shield_action_app":["shield_action_svc"],"shield_anchor_app":["shield_anchor_svc"]}'

  shield-core:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      shield-core-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://shield_core_svc:${SERVICE_DB_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_core}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SSL:
      KAFKA_SASL_MECHANISM:
      KAFKA_SASL_USERNAME:
      KAFKA_SASL_PASSWORD:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-shield}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-shield12345}
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-zoiko-shield-evidence-worm}
      GOOGLE_CLOUD_PROJECT:
      GOOGLE_APPLICATION_CREDENTIALS:
      EVIDENCE_GCS_BUCKET:
      EVIDENCE_GCS_LOCATION:
      TENANT_RETENTION_DEFAULT_DAYS:
      TENANT_RETENTION_DEFAULT_AUTHORITY:
      CASE_AUTO_PROMOTION_ENABLED:
      CASE_AUTO_PROMOTION_MIN_SEVERITY:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_ISSUER: ${JWT_ISSUER:-zoikoshield}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-zoikoshield-api}
      IAM_POLICY_VERSION: ${IAM_POLICY_VERSION:-iam-policy-1.0.0}
      SSO_PUBLIC_BASE_URL: ${SSO_PUBLIC_BASE_URL:-http://localhost:3001}
      SSO_APP_BASE_URL: ${SSO_APP_BASE_URL:-http://localhost:3000}
      SSO_ALLOWED_IDP_HOSTS: ${SSO_ALLOWED_IDP_HOSTS:-}
      SSO_SECRET_REFS_JSON: ${SSO_SECRET_REFS_JSON:-{}}
      SSO_TRANSACTION_ENCRYPTION_KEY: ${SSO_TRANSACTION_ENCRYPTION_KEY:-local-sso-transaction-key-change-me}
      ZOIKOID_OIDC_ISSUER: ${ZOIKOID_OIDC_ISSUER:-}
      ZOIKOID_OIDC_AUTHORIZATION_ENDPOINT: ${ZOIKOID_OIDC_AUTHORIZATION_ENDPOINT:-}
      ZOIKOID_OIDC_TOKEN_ENDPOINT: ${ZOIKOID_OIDC_TOKEN_ENDPOINT:-}
      ZOIKOID_OIDC_JWKS_URI: ${ZOIKOID_OIDC_JWKS_URI:-}
      ZOIKOID_OIDC_CLIENT_ID: ${ZOIKOID_OIDC_CLIENT_ID:-}
      ZOIKOID_OIDC_CLIENT_SECRET_REF: ${ZOIKOID_OIDC_CLIENT_SECRET_REF:-ZOIKOID_OIDC_CLIENT_SECRET}
      ZOIKOID_OIDC_CLIENT_SECRET: ${ZOIKOID_OIDC_CLIENT_SECRET:-}
      ZOIKOID_OIDC_SIGNING_ALGORITHM: ${ZOIKOID_OIDC_SIGNING_ALGORITHM:-RS256}
      ZOIKOID_REQUIRE_MFA: ${ZOIKOID_REQUIRE_MFA:-true}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SERVICE_NAME: shield-core
      WORKLOAD_IDENTITY_DEV_SECRET: ${WORKLOAD_IDENTITY_DEV_SECRET:-local-workload-identity-change-me}
      SUBJECT_KEY_WRAPPING_SECRET: ${SUBJECT_KEY_WRAPPING_SECRET:-local-subject-key-wrapping-change-me}
      SHIELD_AI_BASE_URL: http://shield-ai:3003
      SHIELD_ANCHOR_BASE_URL: http://shield-anchor:3005
      # Without this, shield-core falls back to localhost:3002 — which inside
      # this container is shield-core itself, so every ingest call fails.
      SHIELD_INGEST_BASE_URL: http://shield-ingest:3002
      # Optional below: value-less keys are taken from .env when set and
      # omitted when not, so the code's own defaults still apply. An empty
      # "${VAR:-}" would instead override those defaults with "".
      WORKLOAD_IDENTITY_PRIVATE_KEY_PEM:
      WORKLOAD_IDENTITY_PUBLIC_KEY_PEM:
      WORKLOAD_MTLS_SECRET:
      SUPPORTED_DATA_REGIONS:
      RETENTION_POLICY_REFS:
      PUBLIC_DEVELOPER_API_ENABLED:
      TERMS_OF_SERVICE_TEXT:
      TERMS_OF_SERVICE_VERSION:
      ACCESS_DISCLOSURE_TEXT:
      ACCESS_DISCLOSURE_VERSION:
      WEBAUTHN_RP_ID:
      WEBAUTHN_ORIGIN:
      METERING_SECRET:
      EXPORT_DOWNLOAD_SIGNING_SECRET:
      STRIPE_WEBHOOK_SECRET:
      COLLECTOR_SIGNING_PRIVATE_KEY_PEM:
      COLLECTOR_KMS_KEY_VERSION:
      SUBJECT_KEY_KMS_KEY_NAME:
      SUBJECT_KEY_WRAPPING_KEY_REF:
      KMS_KEY_US_EAST_1:
      KMS_KEY_US_WEST_2:
      KMS_KEY_EU_WEST_1:
      KMS_KEY_EU_CENTRAL_1:
      KMS_KEY_AP_SOUTH_1:
    volumes:
      - ./docs:/app/docs:ro
    ports:
      - "${SHIELD_CORE_PORT:-3001}:3001"

  shield-ingest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      shield-core-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      SERVICE_NAME: shield-ingest
      SHIELD_INGEST_PORT: 3002
      DATABASE_URL: postgres://shield_ingest_svc:${SERVICE_DB_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_core}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SSL:
      KAFKA_SASL_MECHANISM:
      KAFKA_SASL_USERNAME:
      KAFKA_SASL_PASSWORD:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-shield}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-shield12345}
      EVIDENCE_S3_BUCKET: ${EVIDENCE_S3_BUCKET:-zoiko-shield-evidence-worm}
      GOOGLE_CLOUD_PROJECT:
      GOOGLE_APPLICATION_CREDENTIALS:
      EVIDENCE_GCS_BUCKET:
      EVIDENCE_GCS_LOCATION:
      TENANT_RETENTION_DEFAULT_DAYS:
      TENANT_RETENTION_DEFAULT_AUTHORITY:
      SHIELD_CORE_BASE_URL: http://shield-core:3001
      WORKLOAD_IDENTITY_DEV_SECRET: ${WORKLOAD_IDENTITY_DEV_SECRET:-local-workload-identity-change-me}
      WEBHOOK_HMAC_SECRETS: ${WEBHOOK_HMAC_SECRETS:-}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      ENTRA_POLL_INTERVAL_CRON:
      WORKLOAD_IDENTITY_PRIVATE_KEY_PEM:
      WORKLOAD_IDENTITY_PUBLIC_KEY_PEM:
    ports:
      - "${SHIELD_INGEST_PORT:-3002}:3002"

  shield-ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      shield-core-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      SERVICE_NAME: shield-ai
      SHIELD_AI_PORT: 3003
      DATABASE_URL: postgres://shield_ai_svc:${SERVICE_DB_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_core}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SSL:
      KAFKA_SASL_MECHANISM:
      KAFKA_SASL_USERNAME:
      KAFKA_SASL_PASSWORD:
      SHIELD_CORE_BASE_URL: http://shield-core:3001
      WORKLOAD_IDENTITY_DEV_SECRET: ${WORKLOAD_IDENTITY_DEV_SECRET:-local-workload-identity-change-me}
      WORKLOAD_IDENTITY_PRIVATE_KEY_PEM:
      WORKLOAD_IDENTITY_PUBLIC_KEY_PEM:
      OPENAI_API_KEY:
      OPENAI_MODEL:
      GEMINI_API_KEY:
      GEMINI_MODEL:
      VERTEX_AI_API_KEY:
    ports:
      - "${SHIELD_AI_PORT:-3003}:3003"

  shield-action:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      shield-core-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      SERVICE_NAME: shield-action
      SHIELD_ACTION_PORT: 3004
      DATABASE_URL: postgres://shield_action_svc:${SERVICE_DB_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_core}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SSL:
      KAFKA_SASL_MECHANISM:
      KAFKA_SASL_USERNAME:
      KAFKA_SASL_PASSWORD:
      SHIELD_CORE_BASE_URL: http://shield-core:3001
      WORKLOAD_IDENTITY_DEV_SECRET: ${WORKLOAD_IDENTITY_DEV_SECRET:-local-workload-identity-change-me}
      DEV_SIMULATION_SIGNING_KEY:
      ACTION_COMMAND_KMS_KEY_VERSION:
      GOOGLE_CLOUD_PROJECT:
      GOOGLE_APPLICATION_CREDENTIALS:
      ACTION_COMMAND_DEV_PRIVATE_KEY: ${DEV_SIMULATION_SIGNING_KEY:-local-simulation-signing-change-me}
      WORKLOAD_IDENTITY_PRIVATE_KEY_PEM:
      WORKLOAD_IDENTITY_PUBLIC_KEY_PEM:
      DUAL_CUSTODY_SECRET_KEY:
      TWO_MAN_SIGNING_KEY:
      WEBAUTHN_RP_ID:
      WEBAUTHN_ORIGIN:
    ports:
      - "${SHIELD_ACTION_PORT:-3004}:3004"

  shield-anchor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      shield-core-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      SERVICE_NAME: shield-anchor
      SHIELD_ANCHOR_PORT: 3005
      DATABASE_URL: postgres://shield_anchor_svc:${SERVICE_DB_PASSWORD:-shield}@postgres:5432/${POSTGRES_DB:-shield_core}
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SSL:
      KAFKA_SASL_MECHANISM:
      KAFKA_SASL_USERNAME:
      KAFKA_SASL_PASSWORD:
      WORKLOAD_IDENTITY_DEV_SECRET: ${WORKLOAD_IDENTITY_DEV_SECRET:-local-workload-identity-change-me}
      WORKLOAD_IDENTITY_PRIVATE_KEY_PEM:
      WORKLOAD_IDENTITY_PUBLIC_KEY_PEM:
      ANCHOR_SIGNING_PRIVATE_KEY_PEM:
      ANCHOR_KMS_KEY_VERSION:
      ANCHOR_WITNESS_URLS:
      ANCHOR_WITNESS_PUBLIC_KEYS:
      GOOGLE_CLOUD_PROJECT:
      GOOGLE_APPLICATION_CREDENTIALS:
    ports:
      - "${SHIELD_ANCHOR_PORT:-3005}:3005"

volumes:
  postgres_data:
  redpanda_data:
  minio_data:
  opensearch_data:
