apiVersion: apps/v1
kind: Deployment
metadata:
  name: shield-core
  namespace: zoikoshield
  labels:
    app.kubernetes.io/name: shield-core
    app.kubernetes.io/part-of: zoikoshield-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: shield-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shield-core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: core
          image: gcr.io/zoikoshield-artifacts/shield-core:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3001
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: SERVICE_NAME
              value: "shield-core"
            - name: TRUST_PROXY
              value: "loopback, linklocal, uniquelocal"
          envFrom:
            - secretRef:
                name: zoikoshield-production-secrets
                optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
