apiVersion: apps/v1
kind: Deployment
metadata:
  name: shield-core
  namespace: zoikoshield
  labels:
    app.kubernetes.io/name: shield-core
    app.kubernetes.io/part-of: zoikoshield-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: shield-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shield-core
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: core
          image: gcr.io/zoikoshield-artifacts/shield-core:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
---
